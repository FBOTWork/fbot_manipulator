# Cargo slots for the real micky, loaded by manipulator_interface_wx200.launch.py when use_sim_time
# is false. Slot i is (slot_x[i], slot_y[i]) in the arm frame (mtc.world_frame).
#
# Values tuned on the real robot (before the sim baskets fix, see cargo_slots_sim.yaml).
manipulation_task_server:
  ros__parameters:
    mtc:
      cargo_slots:
        slot_x: [-0.17, -0.16, -0.24, -0.22]
        slot_y: [0.09, -0.11, 0.09, -0.115]
        load_z: 0.04     # load_cargo release height, 2 cm above the resting cube
        unload_z: 0.02   # unload_cargo pick height, the resting cube's center
