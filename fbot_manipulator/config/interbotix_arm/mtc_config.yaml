manipulation_task_server:
  ros__parameters:
    mtc:
      arm_group_name: "interbotix_arm"
      hand_group_name: "interbotix_gripper"
      hand_frame: "wx200/ee_gripper_link"   # Interbotix prefixes link names with <robot_name>; default robot_name is "wx200"
      world_frame: "wx200/base_link"
      surface_link: "map"
      # SRDF named group states (from the Interbotix SRDF, e.g. wx200.srdf.xacro)
      hand_open_state: "Released"
      hand_closed_state: "Grasping"
      arm_home_state: "Sleep"      # final resting pose
      arm_ready_state: "Sleep"      # pose held after a successful pick
      approach_min: 0.03
      approach_max: 0.15
      front_approach_height: 0.035  # from the front: approach pose this much above the grasp (the tag), lowered
                                    # behind the object before going in horizontally
      front_grasp_pitch_min: 0.0    # from the front: gripper pitches tried (deg, 0 horizontal, tilted down
      front_grasp_pitch_max: 75.0   # towards the object); tilted it reaches low tags close to the arm
      front_grasp_pitch_step: 15.0  # (z -0.125, x 0.15..0.33 needs 60..75). Shrink the step for a freer/finer
                                    # pitch sweep near the object (more candidates tried, slower on failure).
      front_transit_joints: [0.0, -0.5, 0.3, 1.2, 0.0]  # from the front: straight from the grasp to this pose
                                    # (waist, shoulder, elbow, wrist_angle, wrist_rotate; the waist turned to the
                                    # object), skipping the lift and the horizontal retreat, on the way to the
                                    # cargo: gripper at x 0.23 z 0.22, away from the robot base
      lift_min: 0.01
      lift_max: 0.15
      place_lower_min: 0.02      # place "lower" descent above the place point (smaller for shelves)
      place_lower_max: 0.06
      retreat_min: 0.03
      retreat_max: 0.1
      shake_distance: 0.03           # sideways shake before release (UNLOAD_CARGO_SHAKE only): left,
                                      # right (2x), back to center -- each exact, no tolerance
      shake_intermediate_open_ratio: 0.45   # 0 = hand_open_state (Released), 1 = hand_closed_state
                                            # (Grasping); how far the gripper opens before the shake
      shake_turn_lift_distance: 0.1     # lift/lower around the mid-sequence 90-degree wrist turn
      shake_turn_angle: 1.5707963          # wrist_rotate delta for that turn (90 degrees)
      shake_turn_offset_z: -0.01    # world Z offset [m] when lowering for shake #2 (negative = 1 cm deeper than before the turn)
      shake_turn_offset_x: 0.03      # X offset [m] after the wrist turn, before lowering for shake #2 (XY rotated by the gripper yaw at the place)
      shake_turn_offset_y: 0.02     # Y offset [m], same frame as X (0 = none)
      shake_acceleration_scaling: 0.2   # same for acceleration; this is the one that actually slows 2 cm moves
      shake_velocity_scaling: 0.2   # max velocity scaling (0-1) of the lateral shake moves only; rest of the task uses 0.5
      max_solutions: 2
      grasp_angle_delta: 0.262
      grasp_offset: 0.055          # along the approach axis (negative = grasp deeper toward the arm)
      # Rotation [roll, pitch, yaw] from hand_frame to the grasp IK frame (IK-frame X = approach).
      # The Interbotix ee_gripper_link is already X-forward, so no rotation is needed.
      grasp_frame_rpy: [0.0, 0.0, 0.0]
      # Post-pick grasp verification thresholds for 'left_finger' (0.037 fully open).
      grasp_check:
        enabled: true
        closed_position: 0.022    # finger position when fully closed (empty)
        min_gap: 0.001            # min opening above closed_position to count as "holding"
